server:
  port: 8091
  servlet:
    context-path: /demo/api

spring:
  application:
    name: kockpit-demo-app
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Kockpit SDK Configuration
kockpit:
  sdk:
    domain: demo                    # Application domain
    env: ${ENVIRONMENT:local}       # Environment (local, dev, prod)
    appId: demo-app                 # Application identifier
    enabled: true                   # Enable audit
    service:
      audit:
        notification:
          topic: audit

  audit:
    backend:
      url: ${KOCKPIT_BACKEND_URL:http://localhost:8080/backend/api}    # Kockpit backend URL
      username: ${KOCKPIT_USERNAME:user}                                # Basic auth username
      password: ${KOCKPIT_PASSWORD}                                     # Basic auth password (REQUIRED: set via env var)
      timeout: 5000                                                     # Timeout in ms
      connect-timeout: 3000                                             # Connection timeout in ms
      read-timeout: 5000                                                # Read timeout in ms
# Logging Configuration
logging:
  level:
    root: INFO
    com.kockpit.demo: DEBUG
    org.kockpit: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
