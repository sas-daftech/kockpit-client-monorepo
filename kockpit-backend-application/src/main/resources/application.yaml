server:
  port: 8080
  servlet:
    context-path: /backend/api

springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: kockpit-backoffice
  profiles:
    include: opensearch
  main:
    allow-bean-definition-overriding: true

kockpit:
  sdk:
    domain: rcu
    env: dev
    appId: backend-application

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /backend/actuator
logging:
  level:
    org.kockpit.communication: error
